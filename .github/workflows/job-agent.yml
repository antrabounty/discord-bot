name: Veille emploi designer graphique Lyon

on:
  schedule:
    # Tous les jours à 6h07 UTC (7h07 l'hiver / 8h07 l'été à Lyon).
    - cron: '7 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Rechercher les offres
        env:
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node src/index.js

      - name: Sauvegarder l'historique et le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Veille emploi : rapport du $(TZ=Europe/Paris date +%F)"
          git push
